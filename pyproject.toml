[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "curator"
version = "2.0.0.dev0"
description = "Portable TIFF -> JPEG converter for radiographs (Windows 7)"
requires-python = ">=3.8"
# Точные версии зафиксированы в requirements.txt / requirements-dev.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "vips: тест требует libvips",
    "slow: долгий тест",
]
