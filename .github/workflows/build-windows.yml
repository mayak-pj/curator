name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      CURATOR_VIPS_DIR: ${{ github.workspace }}\build\vips
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch libvips (pinned, sha256)
        run: python scripts/fetch_libvips.py --dest build/vips

      - name: Check libvips DLL imports for Windows 7
        run: python scripts/check_pe_imports.py build/vips

      - name: Tests
        run: python -m pytest -q

      # ------------------------------------------------------------ сборка

      - name: Build application
        run: python -m PyInstaller packaging/curator.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Build smoke tool
        run: python -m PyInstaller packaging/smoke.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Build Qt smoke tool
        run: python -m PyInstaller packaging/qt_smoke.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Check bundles for Windows 7
        run: |
          python scripts/check_pe_imports.py dist/curator --report dist/curator/pe_imports_report.txt
          python scripts/check_pe_imports.py dist/curator_smoke --report dist/curator_smoke/pe_imports_report.txt
          python scripts/check_pe_imports.py dist/curator_qt_smoke --report dist/curator_qt_smoke/pe_imports_report.txt

      # -------------------------------------------------- проверка собранного

      - name: Smoke checks of the packaged tool
        shell: pwsh
        env:
          CURATOR_VIPS_DIR: ""
        run: |
          if (Test-Path dist\curator\_internal\ucrtbase.dll) { throw "ucrtbase.dll попал в сборку" }
          if (-not (Test-Path dist\curator\_internal\libvips-42.dll)) { throw "libvips-42.dll нет в сборке" }
          $process = Start-Process -FilePath dist\curator_smoke\curator_smoke.exe -ArgumentList "--no-gui" -Wait -PassThru
          Get-Content -Encoding UTF8 dist\curator_smoke\smoke_report.txt
          Remove-Item dist\curator_smoke\smoke_report.txt
          if ($process.ExitCode -ne 0) { throw "smoke завершился с кодом $($process.ExitCode)" }
          # Версия 1 не должна случайно потянуть Qt (requirements.txt общий).
          if (Test-Path dist\curator\_internal\PyQt5) { throw "PyQt5 попал в сборку версии 1" }

      # Этап 11 (ARCHITECTURE.md, 26.3): Qt из папки с русским именем и по сетевому пути UNC.
      - name: Qt smoke from Cyrillic folder and UNC path
        shell: pwsh
        env:
          CURATOR_VIPS_DIR: ""
        run: |
          $bytes = (Get-ChildItem -Recurse -File dist\curator_qt_smoke | Measure-Object -Sum Length)
          "Размер сборки Qt smoke: {0:N0} байт, файлов {1}" -f $bytes.Sum, $bytes.Count
          $folder = Join-Path $PWD "build\Проверка Qt №1"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item -Recurse dist\curator_qt_smoke "$folder\Curator v2"
          New-Item -ItemType Directory -Force qt_smoke_ci | Out-Null

          function Invoke-QtSmoke($exe, $label) {
            $dir = Split-Path $exe
            $run = Start-Process -FilePath $exe -ArgumentList "--no-gui" -Wait -PassThru
            Write-Host "===== $label (код $($run.ExitCode)) ====="
            Get-Content -Encoding UTF8 "$dir\qt_smoke_report.txt"
            foreach ($name in "qt_smoke_report.txt", "qt_smoke_light.png", "qt_smoke_dark.png") {
              if (-not (Test-Path "$dir\$name")) { throw "${label}: нет $name" }
              Move-Item "$dir\$name" "qt_smoke_ci\$label-$name"
            }
            if ($run.ExitCode -ne 0) { throw "${label}: smoke завершился с кодом $($run.ExitCode)" }
          }

          Invoke-QtSmoke "$folder\Curator v2\curator_qt_smoke.exe" "cyrillic"

          New-SmbShare -Name curator_test -Path $folder -FullAccess Everyone | Out-Null
          Invoke-QtSmoke "\\localhost\curator_test\Curator v2\curator_qt_smoke.exe" "unc"
          Remove-SmbShare -Name curator_test -Force

      # Переменную CURATOR_VIPS_DIR здесь не сбрасываем: она нужна вспомогательным
      # скриптам на обычном Python. Собранный exe её игнорирует и берёт DLL
      # только из своей папки — это проверяет предыдущий шаг.
      - name: End-to-end run of the packaged application
        shell: pwsh
        run: |
          python scripts/e2e_tree.py create build\e2e
          $run = Start-Process -FilePath dist\curator\curator.exe -ArgumentList "process","build\e2e" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "обработка завершилась с кодом $($run.ExitCode)" }
          python scripts/e2e_tree.py check build\e2e --state processed

          python scripts/e2e_tree.py create build\e2e_rollback
          $rollback = Start-Process -FilePath dist\curator\curator.exe -ArgumentList "process","build\e2e_rollback","--rollback-all" -Wait -PassThru
          if ($rollback.ExitCode -ne 0) { throw "откат завершился с кодом $($rollback.ExitCode)" }
          python scripts/e2e_tree.py check build\e2e_rollback --state original

          $scan = Start-Process -FilePath dist\curator\curator.exe -ArgumentList "scan","build\e2e","--json","build\scan.json" -Wait -PassThru
          if (-not (Test-Path build\scan.json)) { throw "scan не создал отчёт" }
          Get-Content -Encoding UTF8 dist\curator\logs\*.log | Select-Object -Last 8

      # ---------------------------------------------------------- упаковка

      - name: Package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist\curator\journal, dist\curator\logs, dist\curator\locks -ErrorAction SilentlyContinue
          Copy-Item README.md, TROUBLESHOOTING.md, THIRD_PARTY_LICENSES.txt dist\curator\
          Copy-Item packaging\config.example.json dist\curator\
          Compress-Archive -Path dist\curator -DestinationPath curator-win7-x64.zip
          Compress-Archive -Path dist\curator_smoke -DestinationPath curator_smoke-win7-x64.zip
          Copy-Item packaging\qt_smoke_icons\LICENSE.txt dist\curator_qt_smoke\LUCIDE-LICENSE.txt
          Copy-Item THIRD_PARTY_LICENSES.txt dist\curator_qt_smoke\
          Compress-Archive -Path dist\curator_qt_smoke -DestinationPath curator_qt_smoke-win7-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: curator-win7-x64
          path: curator-win7-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: curator_smoke-win7-x64
          path: curator_smoke-win7-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: curator_qt_smoke-win7-x64
          path: curator_qt_smoke-win7-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt_smoke_ci_report
          path: qt_smoke_ci
          if-no-files-found: ignore
