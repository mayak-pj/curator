name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      TIFJPG_VIPS_DIR: ${{ github.workspace }}\build\vips
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch libvips (pinned, sha256)
        run: python scripts/fetch_libvips.py --dest build/vips

      - name: Check libvips DLL imports for Windows 7
        run: python scripts/check_pe_imports.py build/vips

      - name: Tests
        run: python -m pytest -q

      - name: Build smoke exe
        run: python -m PyInstaller packaging/smoke.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Check bundle imports for Windows 7
        run: python scripts/check_pe_imports.py dist/tifjpg_smoke --report dist/tifjpg_smoke/pe_imports_report.txt

      - name: Run smoke checks headless
        shell: pwsh
        env:
          # Собранный exe обязан брать DLL из своей сборки, а не из build/vips.
          TIFJPG_VIPS_DIR: ""
        run: |
          if (Test-Path dist\tifjpg_smoke\_internal\ucrtbase.dll) { throw "ucrtbase.dll попал в сборку" }
          if (-not (Test-Path dist\tifjpg_smoke\_internal\libvips-42.dll)) { throw "libvips-42.dll нет в сборке" }
          Write-Host ("DLL в _internal: " + (Get-ChildItem dist\tifjpg_smoke\_internal\*.dll).Count)
          $process = Start-Process -FilePath dist\tifjpg_smoke\tifjpg_smoke.exe -ArgumentList "--no-gui" -Wait -PassThru
          Get-Content -Encoding UTF8 dist\tifjpg_smoke\smoke_report.txt
          Remove-Item dist\tifjpg_smoke\smoke_report.txt
          exit $process.ExitCode

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\tifjpg_smoke -DestinationPath tifjpg_smoke-win7-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tifjpg_smoke-win7-x64
          path: tifjpg_smoke-win7-x64.zip
